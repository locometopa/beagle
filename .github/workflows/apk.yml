name: Compilar APK

# Cada subida a main (o a mano: Actions > Compilar APK > Run workflow) compila la APK y la publica en la rama «apk»
# (mismo sistema que acelist-tv-apk, pero en otra rama porque aquí main lleva el código):
#   https://github.com/locometopa/beagle/raw/apk/Beagle.apk
# Si la compilación falla, el registro queda en la rama «apk-error».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Firma propia de Beagle: secretos KEYSTORE_B64 (el keystore en base64) y KEYSTORE_PASSWORD.
      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/beagle.keystore
            echo "Firma de Beagle preparada"
          else
            echo "::warning::Sin el secreto KEYSTORE_B64: la APK sale firmada con la clave de pruebas"
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee compilacion.log

      - name: Publicar la APK en la rama apk
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          mkdir -p /tmp/apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/apk/Beagle.apk
          cp compilacion.log /tmp/apk/
          cd /tmp/apk
          echo "$VERSION" > version.txt
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b apk && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Beagle $VERSION"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Guardar el error en la rama apk-error
        if: failure()
        run: |
          mkdir -p /tmp/err && cp compilacion.log /tmp/err/ 2>/dev/null || echo "sin registro" > /tmp/err/compilacion.log
          cd /tmp/err
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b apk-error && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Error de compilación"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-error
